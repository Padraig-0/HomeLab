services:
  npm:
    container_name: nginx-proxy-manager
    image: 'jc21/nginx-proxy-manager:2.15.1'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      TZ: "Europe/London"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
